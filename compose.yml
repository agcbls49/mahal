services:
  postgres:
    image: postgres:18.2
    container_name: mahal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahal
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
      BACKEND_URL: http://backend:4000
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: mahal-backend
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mahal
      DB_USER: appuser
      DB_PASSWORD: password
      PORT: 4000

  frontend:
    build: ./frontend
    container_name: mahal-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000

volumes:
  postgresql-data: